<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ssMemo V0.126.1e1</title>
    <style>
/* [추가/수정] CSS 변수 정의 (기본 라이트 모드) */
:root {
    --modal-bg: #ffffff;
    --modal-text: #000000;
    --search-border: #cfd8dc;
}

/* [추가] 다크 테마 클래스 */
body.dark-theme {
    --modal-bg: #2d2d2d;
    --modal-text: #ffffff;
    --search-border: #444444;
}

body {
    margin: 0;
    padding: 0;
    background-color: transparent;
    font-family: sans-serif;
    user-select: none;
    overflow: hidden;
    /* transition 추가하여 테마 변경 시 부드럽게 */
    transition: background-color 0.3s;
}

/* 다크모드에서 입력창과 버튼 가시성 확보 */
body.dark-theme textarea {
    background-color: #404040;
    color: white;
    border: 1px solid #555;
}

#app {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
}

button {
    cursor: pointer;
    -webkit-app-region: no-drag;
}

#note-tooltip {
    position: fixed;
    max-width: 260px;
    padding: 6px 8px;
    background: rgba(230, 230, 230, 0.9);
    color: #000000;
    font-size: 12px;
    border-radius: 6px;
    pointer-events: none;
    white-space: pre-wrap;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    z-index: 1000;
}

.hidden { display: none !important; }

/* 메모장 패널 스타일 */
.note-panel {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: var(--modal-bg);
    border: 1px solid var(--search-border);
    border-radius: 0;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    z-index: 150;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: background-color 0.2s, border-color 0.2s;
}

/* 드래그 오버 시 시각적 효과 */
.note-panel.drag-over {
    background: rgba(33, 150, 243, 0.1);
    border: 2px dashed #2196F3;
}

body.dark-theme .note-panel.drag-over {
    background: rgba(33, 150, 243, 0.15);
    border: 2px dashed #64B5F6;
}

.note-panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 8px;
    background: rgba(0, 0, 0, 0.05);
    border-bottom: 1px solid var(--search-border);
    color: var(--modal-text);
    font-weight: bold;
    gap: 6px;
    flex-wrap: wrap;
    min-height: 34px;
}

.current-memo-title {
    font-size: 11px;
    color: #777;
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: center;
}

body.dark-theme .current-memo-title {
    color: #bbb;
}

.note-search-controls {
    display: flex;
    align-items: center;
    gap: 0;
    flex: 1 1 auto;
    justify-content: center;
    min-width: 0;
}

.note-search-controls input {
    width: 150px;
    max-width: 100%;
    height: 32px;
    padding: 0 8px;
    border-radius: 6px;
    border: 1px solid var(--search-border);
    background: transparent;
    color: var(--modal-text);
    outline: none;
    font-weight: normal;
    font-size: 14px;
}

.note-search-controls button {
    background: none;
    border: none;
    font-size: 18px;
    padding: 6px;
    min-width: 36px;
    min-height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.note-search-controls button:hover {
    background: rgba(0, 0, 0, 0.08);
}

body.dark-theme .note-search-controls button:hover {
    background: rgba(255, 255, 255, 0.1);
}

.note-search-controls input.note-search-miss {
    border-color: #d32f2f;
}

.note-icon-btn {
    background: none;
    border: none;
    padding: 6px;
    color: var(--modal-text);
    font-size: 18px;
    cursor: pointer;
    min-width: 36px;
    min-height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.note-icon-btn:hover {
    background: rgba(0, 0, 0, 0.08);
    border-radius: 30%;
}

.note-editor-container {
    flex: 1;
    min-height: 0;
    display: flex;
    overflow: hidden;
    position: relative;
}

.line-numbers {
    width: 40px;
    /* 우측 8px = 숫자와 경계선 사이 간격. 좌측 0. 상하 10px(textarea padding과 일치). */
    padding: 10px 8px 10px 0;
    text-align: right;
    background: rgba(0, 0, 0, 0.03);
    border-right: 1px solid var(--search-border);
    color: #888;
    font-family: monospace;
    font-size: 14px;
    line-height: 24px;
    /* 단일 텍스트 노드("1\n2\n...")로 줄번호를 그린다.
       white-space: pre 로 \n을 줄바꿈으로 보존, line-height(24px)가
       textarea와 동일해 시각적으로 1:1 정렬. <div> N개 생성 비용을 제거 */
    white-space: pre;
    user-select: none;
    overflow: hidden;
    box-sizing: border-box;
}

.note-editor {
    flex: 1;
    border: none;
    outline: none;
    padding: 10px;
    margin: 0;
    resize: none;
    font-family: monospace;
    font-size: 14px;
    line-height: 24px; /* line-numbers와 동일하게 설정 */
    background: transparent;
    color: var(--modal-text);
    overflow-y: auto;
    box-sizing: border-box;
    white-space: pre;
    overflow-x: auto;
    height: 100%;
}

/* 22줄이 넘어가면 스크롤바 표시 (기존에는 항상 숨김이었으나 변경) */
.note-editor::-webkit-scrollbar {
    display: initial;
    width: 8px;
}

.note-editor::-webkit-scrollbar-thumb {
    background: rgba(0, 0, 0, 0.2);
    border-radius: 4px;
}

body.dark-theme .note-editor::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.2);
}

.note-char-count-panel {
    justify-content: space-between;
    align-items: center;
    padding: 6px 8px;
    color: var(--modal-text);
    font-weight: lighter;
    font-size: 11px;
    white-space: nowrap;
}

/* 커스텀 모달 스타일 */
.custom-modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    animation: fadeIn 0.2s ease;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.custom-modal {
    background: var(--modal-bg);
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    min-width: 320px;
    max-width: 500px;
    animation: slideIn 0.2s ease;
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateY(-20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.custom-modal-header {
    padding: 16px 20px;
    font-weight: bold;
    font-size: 16px;
    color: var(--modal-text);
    border-bottom: 1px solid var(--search-border);
}

.custom-modal-body {
    padding: 20px;
    color: var(--modal-text);
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 60vh;
    overflow-y: auto;
}

/* 메모 관리 모달 */
.memo-manager-modal {
    max-width: 600px;
}

.memo-manager-body {
    white-space: normal;
}

.memo-manager-new-btn {
    width: 100%;
    margin-bottom: 12px;
    background: #4caf50;
}

.memo-manager-new-btn:hover {
    background: #388e3c;
}

.memo-manager-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.memo-manager-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border: 1px solid var(--search-border, #cfd8dc);
    border-radius: 4px;
    background: rgba(0, 0, 0, 0.02);
}

body.dark-theme .memo-manager-row {
    background: rgba(255, 255, 255, 0.03);
}

.memo-manager-row.is-current {
    border-color: #4caf50;
    background: rgba(76, 175, 80, 0.08);
}

.memo-manager-title {
    flex: 1 1 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 14px;
}

.memo-manager-actions {
    flex: 0 0 auto;
    display: flex;
    gap: 4px;
}

.memo-manager-action {
    padding: 4px 10px;
    font-size: 12px;
    background: #2196F3;
    color: white;
    border: none;
    border-radius: 3px;
    cursor: pointer;
}

.memo-manager-action:hover:not(:disabled) {
    background: #1976D2;
}

.memo-manager-action:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.memo-manager-action-danger {
    background: #e53935;
}

.memo-manager-action-danger:hover:not(:disabled) {
    background: #c62828;
}

.memo-manager-empty {
    padding: 16px;
    color: #888;
    text-align: center;
}

/* 텍스트 입력 모달 */
.prompt-message {
    margin-bottom: 10px;
}

.prompt-input {
    width: 100%;
    padding: 8px 10px;
    font-size: 14px;
    border: 1px solid var(--search-border, #cfd8dc);
    border-radius: 4px;
    box-sizing: border-box;
    color: var(--modal-text);
    background: var(--modal-bg);
}

.prompt-error {
    margin-top: 6px;
    min-height: 18px;
    color: #e53935;
    font-size: 12px;
}

.custom-modal-footer {
    padding: 12px 20px;
    display: flex;
    justify-content: flex-end;
    border-top: 1px solid var(--search-border);
}

/* choose() 모달의 옵션 버튼 — body와 footer 사이에 세로로 쌓는다 */
.custom-modal-choices {
    padding: 8px 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.custom-modal-choices .custom-modal-btn {
    width: 100%;
    text-align: left;
    padding: 10px 14px;
}

.custom-modal-choices .custom-modal-btn.is-current {
    background: #4caf50;
}

.custom-modal-choices .custom-modal-btn.is-current:hover {
    background: #388e3c;
}

.custom-modal-btn {
    padding: 8px 24px;
    background: #2196F3;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
}

.custom-modal-btn:hover {
    background: #1976D2;
}

.custom-modal-footer .custom-modal-btn-cancel {
    background: #757575;
    margin-right: 8px;
}
.custom-modal-footer .custom-modal-btn-cancel:hover {
    background: #616161;
}

.custom-modal-footer .custom-modal-btn-danger {
    background: #d32f2f;
}
.custom-modal-footer .custom-modal-btn-danger:hover {
    background: #b71c1c;
}

.custom-modal-btn:active {
    transform: scale(0.98);
}

/* 큰 파일 로드 중 표시되는 오버레이 스피너 */
.loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    z-index: 10000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    font-size: 14px;
    gap: 12px;
}

.loading-overlay-icon {
    font-size: 48px;
    animation: spin 1.2s linear infinite;
}

.loading-overlay-message {
    background: rgba(0, 0, 0, 0.5);
    padding: 6px 14px;
    border-radius: 6px;
    font-weight: 500;
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
}

/* Markdown 미리보기 */
.note-md-preview {
    flex: 1;
    height: 100%;
    min-height: 0;          /* flex 부모 안에서 overflow가 동작하도록 */
    overflow-y: auto;
    padding: 14px 20px 32px; /* 마지막 줄이 잘려 보이지 않도록 하단 여유 */
    color: var(--modal-text);
    background: var(--modal-bg);
    line-height: 1.55;
    font-size: 14px;
    box-sizing: border-box;
}

.note-md-preview > *:last-child {
    margin-bottom: 0;
}

.note-md-preview h1,
.note-md-preview h2,
.note-md-preview h3,
.note-md-preview h4,
.note-md-preview h5,
.note-md-preview h6 {
    margin: 1em 0 0.4em;
    line-height: 1.25;
    color: var(--modal-text);
}

.note-md-preview h1 { font-size: 1.7em; border-bottom: 1px solid var(--search-border); padding-bottom: 0.2em; }
.note-md-preview h2 { font-size: 1.4em; border-bottom: 1px solid var(--search-border); padding-bottom: 0.2em; }
.note-md-preview h3 { font-size: 1.2em; }
.note-md-preview p  { margin: 0.6em 0; }
.note-md-preview ul,
.note-md-preview ol { padding-left: 1.6em; margin: 0.4em 0; }
.note-md-preview li { margin: 0.15em 0; }

.note-md-preview code {
    font-family: monospace;
    background: rgba(0, 0, 0, 0.08);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 0.9em;
}

.note-md-preview pre {
    background: rgba(0, 0, 0, 0.08);
    padding: 10px 12px;
    border-radius: 6px;
    overflow-x: auto;
}
.note-md-preview pre code {
    background: transparent;
    padding: 0;
    font-size: 0.9em;
}

body.dark-theme .note-md-preview code,
body.dark-theme .note-md-preview pre {
    background: rgba(255, 255, 255, 0.08);
}

.note-md-preview blockquote {
    margin: 0.6em 0;
    padding: 0.2em 0.9em;
    border-left: 3px solid var(--search-border);
    color: inherit;
    opacity: 0.85;
}

.note-md-preview hr {
    border: none;
    border-top: 1px solid var(--search-border);
    margin: 1em 0;
}

.note-md-preview a {
    color: #2196F3;
    text-decoration: none;
}
.note-md-preview a:hover { text-decoration: underline; }

.note-md-preview table {
    border-collapse: collapse;
    margin: 0.8em 0;
    display: block;
    overflow-x: auto;
    max-width: 100%;
}
.note-md-preview th,
.note-md-preview td {
    border: 1px solid var(--search-border);
    padding: 6px 10px;
    text-align: left;
}
.note-md-preview thead th {
    background: rgba(0, 0, 0, 0.06);
    font-weight: 600;
}
body.dark-theme .note-md-preview thead th {
    background: rgba(255, 255, 255, 0.08);
}

/* 탭 UI 스타일 */
.note-tabs-container {
    display: flex;
    gap: 4px;
    padding: 8px 8px 0 8px;
    background: rgba(0, 0, 0, 0.02);
    border-bottom: 1px solid var(--search-border);
    overflow-x: auto;
    overflow-y: hidden;
    flex-wrap: nowrap;
    -webkit-overflow-scrolling: touch;
}

.note-tabs-container::-webkit-scrollbar {
    height: 4px;
}

.note-tabs-container::-webkit-scrollbar-thumb {
    background: rgba(0, 0, 0, 0.2);
    border-radius: 2px;
}

body.dark-theme .note-tabs-container::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.2);
}

.note-tab {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    background: rgba(0, 0, 0, 0.1);
    border: 1px solid var(--search-border);
    border-bottom: none;
    border-radius: 6px 6px 0 0;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s;
    min-width: 100px;
    flex-shrink: 0;
}

.note-tab:hover {
    background: rgba(0, 0, 0, 0.15);
}

body.dark-theme .note-tab:hover {
    background: rgba(255, 255, 255, 0.15);
}

.note-tab-active {
    background: var(--modal-bg) !important;
    border-bottom: 1px solid var(--modal-bg);
    font-weight: bold;
}

/* 메인 탭: 메모 제목을 탭 이름 위에 세로로 표시 */
.note-tab[data-tab="main"] {
    flex-direction: column;
    align-items: center;
    gap: 2px;
}

.note-tab-hidden {
    display: none;
}

.note-tab-label {
    color: var(--modal-text);
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* 편집 가능한 메모 탭의 미저장 표시 */
.note-tab-dirty .note-tab-label::before {
    content: '• ';
    color: #e57373;
    font-weight: bold;
}

.note-tab-close {
    background: none;
    border: none;
    color: var(--modal-text);
    font-size: 14px;
    padding: 0;
    cursor: pointer;
    opacity: 0.6;
    transition: opacity 0.2s;
}

.note-tab-close:hover {
    opacity: 1;
}

/* 탭별 색상 구분 */
.note-tab[data-tab="0"] { border-top: 3px solid #FF6B6B; }
.note-tab[data-tab="1"] { border-top: 3px solid #4ECDC4; }
.note-tab[data-tab="2"] { border-top: 3px solid #FFE66D; }
.note-tab[data-tab="3"] { border-top: 3px solid #95E1D3; }
.note-tab[data-tab="4"] { border-top: 3px solid #FFA07A; }
.note-tab[data-tab="5"] { border-top: 3px solid #87CEEB; }
.note-tab[data-tab="6"] { border-top: 3px solid #DDA0DD; }

/* 읽기 전용 에디터 스타일 */
.note-editor-readonly {
    background: rgba(0, 0, 0, 0.02);
}

.note-editor-readonly .note-editor {
    background: rgba(0, 0, 0, 0.02);
    cursor: default;
}

body.dark-theme .note-editor-readonly .note-editor {
    background: rgba(255, 255, 255, 0.02);
}

/* 모바일 최적화 미디어 쿼리 */
@media (max-width: 768px) {
    .note-panel-header {
        padding: 6px;
        gap: 4px;
        min-height: auto;
    }

    .note-search-controls input {
        width: 100px;
        height: 30px;
        font-size: 13px;
    }

    .note-search-controls button {
        font-size: 16px;
        padding: 4px;
        min-width: 32px;
        min-height: 32px;
    }

    .note-icon-btn {
        font-size: 16px;
        padding: 4px;
        min-width: 32px;
        min-height: 32px;
    }

    .note-char-count-panel {
        font-size: 10px;
        padding: 4px 6px;
    }

    .line-numbers {
        width: 32px;
        font-size: 12px;
        line-height: 20px;
        padding-right: 6px; /* 모바일은 6px로 좁힘 (데스크톱 8px 오버라이드) */
    }

    .note-editor {
        font-size: 13px;
        line-height: 20px;
        padding: 8px;
    }

    .note-tab {
        padding: 6px 10px;
        min-width: 80px;
        font-size: 12px;
    }

    .note-tab-label {
        font-size: 12px;
    }

    .note-tab-close {
        font-size: 12px;
    }

    .custom-modal {
        min-width: 280px;
        max-width: 90%;
        margin: 0 10px;
    }

    .custom-modal-header {
        padding: 12px 16px;
        font-size: 14px;
    }

    .custom-modal-body {
        padding: 16px;
        font-size: 13px;
    }

    .custom-modal-footer {
        padding: 10px 16px;
    }

    .custom-modal-btn {
        padding: 6px 20px;
        font-size: 13px;
    }
}

@media (max-width: 480px) {
    .note-panel-header {
        flex-wrap: wrap;
        justify-content: center;
    }


    .note-search-controls {
        order: 2;
        width: 100%;
        justify-content: center;
    }

    .note-search-controls input {
        width: 80px;
    }

    .note-char-count-panel {
        order: 1;
        width: auto;
    }

    .note-icon-btn {
        order: 3;
    }
}
</style>
</head>
<body>
<div id="app">
    <div id="note-panel" class="note-panel">
        <div class="note-panel-header">
            <span id="note-char-count" class="note-char-count-panel">글자수: 0</span>
            <div class="note-search-controls">
                <input id="noteSearchInput" type="text" placeholder="검색 (Ctrl + I)">
                <button id="noteSearchBtn" type="button" title="">🔍</button>
                <button id="noteSearchPrevBtn" type="button" title="Ctrl + <">⬅️</button>
                <button id="noteSearchNextBtn" type="button" title="Ctrl + >">➡️</button>

// ========================================
// Pure utility helpers (DOM-free, testable)
// ========================================

const CHUNK_DELIMITER = "\n\n<----------[절취선]---------->\n\n";

// 입력 문자열을 len 글자 단위로 잘라 delimiter로 이어 붙입니다.
function splitTextIntoChunks(text, len, delimiter = CHUNK_DELIMITER) {
    if (!text || !len || len <= 0 || text.length <= len) return text;
    let result = '';
    for (let i = 0; i < text.length; i += len) {
        if (i > 0) result += delimiter;
        result += text.substring(i, i + len);
    }
    return result;
}

// splitTextIntoChunks가 삽입한 delimiter를 모두 제거합니다.
function joinTextChunks(text, delimiter = CHUNK_DELIMITER) {
    if (!text || !text.includes(delimiter)) return text;
    return text.split(delimiter).join('');
}

// 절취선 토글 버튼이 클릭됐을 때 어떤 동작을 해야 하는지 결정.
// - delimiter가 이미 있으면 길이와 무관하게 'join' (짧아진 메모에서도 토글 가능)
// - delimiter가 없을 때는 text가 len보다 길어야 'split', 아니면 'noop'
// 분기 로직을 순수 함수로 두어 단위 테스트가 가능하도록 분리.
function decideChunkAction(text, len, delimiter = CHUNK_DELIMITER) {
    if (typeof text !== 'string' || !len || len <= 0) return 'noop';
    if (text.includes(delimiter)) return 'join';
    return text.length > len ? 'split' : 'noop';
}

// 다음 애니메이션 프레임까지 메인 스레드를 양보. 큰 파일을 단계별로
// 처리할 때 각 단계 사이에 브라우저가 페인트/입력 처리할 시간을 주기 위해 사용.
// 페이지가 백그라운드/숨김 상태라 rAF가 throttle되면 setTimeout fallback으로
// 빠져나와 await가 영구 대기하는 것을 막는다 (스피너 잔류 방지).
function nextFrame() {
    return new Promise(resolve => {
        let done = false;
        const finish = () => { if (done) return; done = true; resolve(); };
        requestAnimationFrame(finish);
        setTimeout(finish, 100);
    });
}

// 호출이 ms 동안 멈출 때까지 fn 실행을 미루는 trailing-edge debounce.
// 큰 파일 입력 중 keystroke마다 발생하는 O(n) 줄수 스캔을 묶기 위해 사용.
function debounce(fn, ms) {
    let timer = null;
    return function debounced(...args) {
        if (timer) clearTimeout(timer);
        timer = setTimeout(() => {
            timer = null;
            fn.apply(this, args);
        }, ms);
    };
}

// 줄 번호 표시용 단일 텍스트("1\n2\n...\nN")를 만든다.
// `<div>` N개를 만들지 않고 한 번의 textContent 할당으로 끝내기 위한 헬퍼.
// count<1이면 빈 문자열 반환.
function buildLineNumbersText(count) {
    if (!count || count < 1) return '';
    let buf = '1';
    for (let i = 2; i <= count; i++) {
        buf += '\n' + i;
    }
    return buf;
}

// content 안에서 query를 정방향 검색. 없으면 -1.
// startIndex 이후에서 못 찾고 startIndex>0이면 처음부터 다시 시도(랩어라운드).
function findNextIndex(content, query, startIndex = 0) {
    if (!content || !query) return -1;
    const safeStart = Math.max(0, startIndex);
    let idx = content.indexOf(query, safeStart);
    if (idx === -1 && safeStart > 0) {
        idx = content.indexOf(query, 0);
    }
    return idx;
}

// content 안에서 query를 역방향 검색. 없으면 -1.
// 못 찾으면 끝에서부터 다시 시도(랩어라운드).
function findPrevIndex(content, query, startIndex) {
    if (!content || !query) return -1;
    if (startIndex < 0) return -1;
    let idx = content.lastIndexOf(query, startIndex);
    if (idx === -1) {
        idx = content.lastIndexOf(query, content.length);
    }
    return idx;
}


/* === src/markdown.js === */
// ========================================
// 외부 의존성 없는 경량 Markdown 렌더러
// XSS 방지를 위해 모든 입력을 HTML 이스케이프 후 처리합니다.
// 지원: 헤더(#~######), bold(**), italic(*/_), inline code(`),
//       코드 블록(```), 순서/비순서 리스트, 링크[text](url),
//       수평선(---), 인용(>), GFM 표(|---|), 단락,
//       <details>/<summary> 접기 (속성은 open만 허용),
//       인라인 HTML <b>/<i>/<u>/<br> (속성 없는 형태만)
// ========================================

function escapeHtml(s) {
    return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function renderInline(text) {
    let s = escapeHtml(text);
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
    s = s.replace(/(^|[^_])_([^_\n]+)_(?!_)/g, '$1<em>$2</em>');
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (match, label, url) => {
        // 안전한 스킴만 허용 (javascript: 등 차단)
        if (!/^(https?:\/\/|mailto:|#|\/|\.\/|\.\.\/)/i.test(url)) return match;
        return `<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`;
    });
    // 안전한 인라인 HTML 태그 화이트리스트 (속성 없는 형태만).
    // escapeHtml 이후의 리터럴 패턴만 복원하므로, 속성이 붙은 변형은
    // 매치되지 않아 이스케이프된 상태로 유지되어 XSS를 차단합니다.
    s = s.replace(/&lt;(\/?)([biu])&gt;/gi, '<$1$2>');
    s = s.replace(/&lt;br\s*\/?&gt;/gi, '<br>');
    return s;
}

// 표 한 행의 셀들을 추출. `|` 경계를 가진 행과 그렇지 않은 행 모두 처리.
function parseTableRow(line) {
    let s = line.trim();
    if (s.startsWith('|')) s = s.slice(1);
    if (s.endsWith('|')) s = s.slice(0, -1);
    return s.split('|').map(c => c.trim());
}

// 표 구분 행 여부: `|---|:---:|---:|` 형태. 셀 정렬 배열을 반환하거나 null.
function parseTableSeparator(line) {
    if (!/\|/.test(line)) return null;
    const cells = parseTableRow(line);
    if (cells.length === 0) return null;
    const aligns = [];
    for (const cell of cells) {
        if (!/^:?-{3,}:?$/.test(cell)) return null;
        const left = cell.startsWith(':');
        const right = cell.endsWith(':');
        aligns.push(left && right ? 'center' : right ? 'right' : left ? 'left' : null);
    }
    return aligns;
}

function renderTable(headerLine, aligns, bodyLines) {
    const headers = parseTableRow(headerLine);
    const colCount = headers.length;
    const headHtml = headers
        .map((h, i) => {
            const a = aligns[i];
            const styleAttr = a ? ` style="text-align:${a}"` : '';
            return `<th${styleAttr}>${renderInline(h)}</th>`;
        })
        .join('');
    const bodyHtml = bodyLines.map(line => {
        const cells = parseTableRow(line);
        // 부족한 셀은 빈 문자열로 채우고, 초과는 잘라냅니다.
        const padded = cells.slice(0, colCount);
        while (padded.length < colCount) padded.push('');
        const tds = padded
            .map((c, i) => {
                const a = aligns[i];
                const styleAttr = a ? ` style="text-align:${a}"` : '';
                return `<td${styleAttr}>${renderInline(c)}</td>`;
            })
            .join('');
        return `<tr>${tds}</tr>`;
    }).join('');
    return `<table><thead><tr>${headHtml}</tr></thead><tbody>${bodyHtml}</tbody></table>`;
}

function renderMarkdown(text) {
    if (!text) return '';
    const lines = text.split('\n');
    const out = [];
    let inCode = false;
    let codeBuffer = [];
    let listType = null;
    let paragraphBuffer = [];

    const flushParagraph = () => {
        if (paragraphBuffer.length) {
            out.push('<p>' + paragraphBuffer.map(renderInline).join('<br>') + '</p>');
            paragraphBuffer = [];
        }
    };
    const closeList = () => {
        if (listType) {
            out.push(`</${listType}>`);
            listType = null;
        }
    };

    for (let i = 0; i < lines.length; i++) {
        const line = lines[i];

        if (inCode) {
            if (/^```/.test(line)) {
                out.push(`<pre><code>${codeBuffer.map(escapeHtml).join('\n')}</code></pre>`);
                codeBuffer = [];
                inCode = false;
            } else {
                codeBuffer.push(line);
            }
            continue;
        }
        if (/^```/.test(line)) {
            flushParagraph();
            closeList();
            inCode = true;
            continue;
        }

        const heading = line.match(/^(#{1,6})\s+(.+)$/);
        if (heading) {
            flushParagraph();
            closeList();
            const level = heading[1].length;
            out.push(`<h${level}>${renderInline(heading[2])}</h${level}>`);
            continue;
        }

        if (/^(-{3,}|\*{3,}|_{3,})$/.test(line.trim())) {
            flushParagraph();
            closeList();
            out.push('<hr>');
            continue;
        }

        if (/^>\s?/.test(line)) {
            flushParagraph();
            closeList();
            out.push(`<blockquote>${renderInline(line.replace(/^>\s?/, ''))}</blockquote>`);
            continue;
        }

        // <details>/<summary> 접기 블록. 보안을 위해 정확한 패턴만 허용.
        const trimmed = line.trim();
        if (/^<details(\s+open)?>$/i.test(trimmed)) {
            flushParagraph();
            closeList();
            out.push(/\sopen>$/i.test(trimmed) ? '<details open>' : '<details>');
            continue;
        }
        if (/^<\/details>$/i.test(trimmed)) {
            flushParagraph();
            closeList();
            out.push('</details>');
            continue;
        }
        const inlineSummary = trimmed.match(/^<summary>([\s\S]*)<\/summary>$/i);
        if (inlineSummary) {
            flushParagraph();
            closeList();
            out.push(`<summary>${renderInline(inlineSummary[1])}</summary>`);
            continue;
        }
        if (/^<summary>$/i.test(trimmed)) {
            flushParagraph();
            closeList();
            out.push('<summary>');
            continue;
        }
        if (/^<\/summary>$/i.test(trimmed)) {
            flushParagraph();
            closeList();
            out.push('</summary>');
            continue;
        }

        // 표: 현재 줄에 `|`가 있고 다음 줄이 구분 행이면 표로 처리
        if (/\|/.test(line) && i + 1 < lines.length) {
            const aligns = parseTableSeparator(lines[i + 1]);
            if (aligns) {
                flushParagraph();
                closeList();
                const bodyLines = [];
                let j = i + 2;
                while (j < lines.length && /\|/.test(lines[j]) && lines[j].trim() !== '') {
                    bodyLines.push(lines[j]);
                    j++;
                }
                out.push(renderTable(line, aligns, bodyLines));
                i = j - 1;
                continue;
            }
        }

        const ul = line.match(/^\s*[-*+]\s+(.+)$/);
        if (ul) {
            flushParagraph();
            if (listType !== 'ul') {
                closeList();
                out.push('<ul>');
                listType = 'ul';
            }
            out.push(`<li>${renderInline(ul[1])}</li>`);
            continue;
        }

        const ol = line.match(/^\s*\d+\.\s+(.+)$/);
        if (ol) {
            flushParagraph();
            if (listType !== 'ol') {
                closeList();
                out.push('<ol>');
                listType = 'ol';
            }
            out.push(`<li>${renderInline(ol[1])}</li>`);
            continue;
        }

        if (line.trim() === '') {
            flushParagraph();
            closeList();
            continue;
        }

        closeList();
        paragraphBuffer.push(line);
    }

    if (inCode) {
        out.push(`<pre><code>${codeBuffer.map(escapeHtml).join('\n')}</code></pre>`);
    }
    flushParagraph();
    closeList();
    return out.join('\n');
}


/* === src/file-utils.js === */
// ========================================
// 파일 검증 헬퍼 (DOM-free, testable)
// ========================================

// 파일명이 허용된 텍스트 확장자 목록 중 하나로 끝나는지 검사 (대소문자 무시)
function hasAllowedExtension(fileName) {
    if (!fileName) return false;
    const lower = fileName.toLowerCase();
    return ALLOWED_TEXT_EXTENSIONS.some(ext => lower.endsWith(ext));
}

// File 객체가 텍스트로 허용되는지: 확장자 OR MIME이 text/plain
function isAllowedTextFile(file) {
    if (!file) return false;
    if (hasAllowedExtension(file.name)) return true;
    return file.type === 'text/plain';
}

// 파일 크기가 업로드 상한을 넘는지
function isOversized(file) {
    if (!file) return false;

// ========================================
// 한글 인코딩 자동 감지/디코딩
// 지원: UTF-8, CP949(EUC-KR 호환), Johab(조합형)
// 외부 라이브러리 없음. UTF-8/EUC-KR은 브라우저의 TextDecoder를 사용하고,
// Johab은 KS X 1001 부속서 3의 조합형 한글 음절 비트 패턴을 직접 디코딩한다.
// ========================================

// UTF-8 디코드. 잘못된 바이트 시퀀스가 있으면 null 반환.
function tryUtf8(buffer) {
    try {
        return new TextDecoder('utf-8', { fatal: true }).decode(buffer);
    } catch {
        return null;
    }
}

function decodeCp949(buffer) {
    // 브라우저의 'euc-kr' 디코더는 실제로 windows-949(=CP949)를 사용한다.
    return new TextDecoder('euc-kr').decode(buffer);
}

// ----- Johab(조합형) 디코더 -----
// Hangul syllable bit layout: 1 IIIII MMMMM FFFFF (16-bit, MSB=1)
// 5-bit 인덱스 → 모던 한글 인덱스 변환 (-1 = 정의 안 됨)

const JOHAB_INITIAL = new Int8Array(32).fill(-1);
[[0x02,0],[0x03,1],[0x04,2],[0x05,3],[0x06,4],
 [0x07,5],[0x08,6],[0x09,7],[0x0A,8],[0x0B,9],
 [0x0C,10],[0x0D,11],[0x0E,12],[0x0F,13],[0x10,14],
 [0x11,15],[0x12,16],[0x13,17],[0x14,18]
].forEach(([k, v]) => { JOHAB_INITIAL[k] = v; });

const JOHAB_MEDIAL = new Int8Array(32).fill(-1);
[[0x03,0],[0x04,1],[0x05,2],[0x06,3],[0x07,4],
 [0x0A,5],[0x0B,6],[0x0C,7],[0x0D,8],[0x0E,9],
 [0x12,10],[0x13,11],[0x14,12],[0x15,13],[0x16,14],
 [0x1A,15],[0x1B,16],[0x1C,17],[0x1D,18],[0x1E,19],[0x1F,20]
].forEach(([k, v]) => { JOHAB_MEDIAL[k] = v; });

const JOHAB_FINAL = new Int8Array(32).fill(-1);
[[0x01,0],
 [0x02,1],[0x03,2],[0x04,3],[0x05,4],[0x06,5],[0x07,6],
 [0x0A,7],[0x0B,8],[0x0C,9],[0x0D,10],[0x0E,11],[0x0F,12],
 [0x12,13],[0x13,14],[0x14,15],[0x15,16],[0x16,17],[0x17,18],
 [0x1A,19],[0x1B,20],[0x1C,21],[0x1D,22],[0x1E,23],[0x1F,24]
].forEach(([k, v]) => { JOHAB_FINAL[k] = v; });

// 두 바이트가 Johab 한글 음절 영역인지 검사.
function isJohabHangulPair(b1, b2) {
    if (b1 < 0x84 || b1 > 0xD3) return false;
    return (b2 >= 0x41 && b2 <= 0x7E) || (b2 >= 0x81 && b2 <= 0xFE);
}

// Johab 2바이트 → Unicode codepoint, 매핑 안 되면 null.
function johabPairToUnicode(b1, b2) {
    const v = (b1 << 8) | b2;
    const init = (v >> 10) & 0x1F;
    const med = (v >> 5) & 0x1F;
    const fin = v & 0x1F;
    const ci = JOHAB_INITIAL[init];
    const mi = JOHAB_MEDIAL[med];
    const fi = JOHAB_FINAL[fin];
    if (ci < 0 || mi < 0 || fi < 0) return null;
    return 0xAC00 + ci * 588 + mi * 28 + fi;
}

function decodeJohab(buffer) {
    const bytes = new Uint8Array(buffer);
    const len = bytes.length;
    // 매 글자마다 string concat (`out += ...`)을 하면 6MB 입력에서 수십 초가
    // 걸려 메인 스레드가 잠긴다. Uint16Array에 codepoint를 채운 뒤 청크별로
    // String.fromCharCode.apply 로 한 번에 합쳐 수십배 빠르다.
    const codes = new Uint16Array(len); // 상한: 바이트당 1글자
    let outLen = 0;
    for (let i = 0; i < len; i++) {
        const b1 = bytes[i];
        if (b1 < 0x80) {
            // ASCII 영역은 그대로 통과.
            codes[outLen++] = b1;
            continue;
        }
        const b2 = i + 1 < len ? bytes[i + 1] : 0;
        if (isJohabHangulPair(b1, b2)) {
            const cp = johabPairToUnicode(b1, b2);
            if (cp != null) {
                codes[outLen++] = cp;
                i++;
                continue;
            }
        }
        // Johab 한글 음절이 아닌 2바이트(한자/특수기호 등)는 매핑이 까다로워
        // 대체 문자(U+FFFD)로 표시한다.
        codes[outLen++] = 0xFFFD;
        if (b2 !== 0) i++;
    }
    // String.fromCharCode.apply 인자 한도(엔진별 ~64K)를 피하려고 청크로 나눈다.
    const CHUNK = 0x8000;
    let result = '';
    for (let i = 0; i < outLen; i += CHUNK) {
        const end = i + CHUNK < outLen ? i + CHUNK : outLen;
        result += String.fromCharCode.apply(null, codes.subarray(i, end));
    }
    return result;
}

// 바이트 분포로 Johab 가능성을 가늠한다.
// CP949(EUC-KR)는 보통 lead byte가 0xA1-0xFE에 분포하지만,
// Johab은 0x84-0xA0 영역도 활발히 사용한다.
function looksLikeJohab(buffer) {
    const bytes = new Uint8Array(buffer);
    let johabRange = 0; // 0x84-0xA0
    let euckrLeadOnly = 0; // 0xA1-0xFE
    for (let i = 0; i < bytes.length; i++) {
        const b = bytes[i];
        if (b >= 0x84 && b <= 0xA0) johabRange++;
        else if (b >= 0xA1 && b <= 0xFE) euckrLeadOnly++;
    }
    // 0x84-0xA0 영역 바이트가 충분히 많고 EUC-KR 영역과 비슷하거나 많으면 Johab으로 판단.
    return johabRange >= 4 && johabRange >= euckrLeadOnly * 0.4;
}

function decodeKoreanText(buffer) {
    const utf8 = tryUtf8(buffer);
    if (utf8 !== null) {
        return { text: utf8, encoding: 'UTF-8' };
    }
    if (looksLikeJohab(buffer)) {
        return { text: decodeJohab(buffer), encoding: 'Johab' };
    }
    return { text: decodeCp949(buffer), encoding: 'CP949' };
}

// 디코드 결과에 U+FFFD(대체 문자) 비율이 높으면 자동 감지가 빗나갔을 가능성이 높다.
// 사용자에게 수동 인코딩 변경(🔤) 힌트를 띄우기 위해 사용.
// 앞쪽 64KB만 표본 검사 — 큰 파일에서도 비용 일정.
function looksGarbled(text) {
    if (!text) return false;
    const sampleLen = text.length < 65536 ? text.length : 65536;
    let replacements = 0;
    for (let i = 0; i < sampleLen; i++) {
        if (text.charCodeAt(i) === 0xFFFD) replacements++;
    }
    // 1% 이상이면 의심 (정상 한국어 텍스트는 U+FFFD가 거의 0)
    return replacements > sampleLen * 0.01;
}

// 명시적 인코딩 지정용 헬퍼 (사용자 수동 선택 시).
function decodeWithEncoding(buffer, encoding) {
    switch (encoding) {
        case 'UTF-8':
            return tryUtf8(buffer) ?? new TextDecoder('utf-8').decode(buffer);
        case 'CP949':
            return decodeCp949(buffer);
        case 'Johab':
            return decodeJohab(buffer);
        default:
            throw new Error(`알 수 없는 인코딩: ${encoding}`);
    }
}

// ========================================
// ssMemo 코드 블럭 실행기
// 지원: 변수 대입, +, -, *, /, //, 괄호, sin/cos/tan, factorial(n<=1000), # 주석
// 정수는 BigInt로 처리해 5000자리 이상도 정확.
// 외부 라이브러리 의존 없이 순수 함수로 구현.
// ========================================

const FACTORIAL_LIMIT = 1000;

// ---- Tokenizer ----
function tokenize(source) {
    const tokens = [];
    let i = 0;
    const len = source.length;
    while (i < len) {
        const ch = source[i];
        if (ch === '#') {
            while (i < len && source[i] !== '\n') i++;
            continue;
        }
        if (ch === '\n') { tokens.push({ type: 'NL' }); i++; continue; }
        if (ch === ' ' || ch === '\t' || ch === '\r') { i++; continue; }

        if (ch >= '0' && ch <= '9') {
            let j = i;
            let hasDot = false;
            while (j < len) {
                const c = source[j];
                if (c >= '0' && c <= '9') { j++; continue; }
                if (c === '.' && !hasDot) { hasDot = true; j++; continue; }
                break;
            }
            if (j < len && (source[j] === 'e' || source[j] === 'E')) {
                hasDot = true;
                j++;
                if (j < len && (source[j] === '+' || source[j] === '-')) j++;
                while (j < len && source[j] >= '0' && source[j] <= '9') j++;
            }
            tokens.push({ type: 'NUM', value: source.slice(i, j), isFloat: hasDot });
            i = j;
            continue;
        }

        if ((ch >= 'a' && ch <= 'z') || (ch >= 'A' && ch <= 'Z') || ch === '_') {
            let j = i;
            while (j < len) {
                const c = source[j];
                if ((c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z') ||
                    (c >= '0' && c <= '9') || c === '_') { j++; continue; }
                break;
            }
            tokens.push({ type: 'ID', value: source.slice(i, j) });
            i = j;
            continue;
        }

        if (ch === '/' && source[i + 1] === '/') {
            tokens.push({ type: 'OP', value: '//' });
            i += 2;
            continue;
        }
        if ('+-*/()=,'.indexOf(ch) >= 0) {
            tokens.push({ type: 'OP', value: ch });
            i++;
            continue;
        }
        throw new Error(`알 수 없는 문자: "${ch}"`);
    }
    tokens.push({ type: 'EOF' });
    return tokens;
}

// ---- Parser (recursive descent) ----
function parse(tokens) {
    let pos = 0;
    const peek = (off = 0) => tokens[pos + off];
    const consume = () => tokens[pos++];
    const expect = (type, value) => {
        const t = peek();
        if (t.type !== type || (value !== undefined && t.value !== value)) {
            throw new Error(`기대한 토큰: ${value || type}, 실제: ${t.value || t.type}`);
        }
        return consume();
    };

    function parsePrimary() {
        const t = peek();
        if (t.type === 'NUM') {
            consume();
            return { type: 'Num', value: t.value, isFloat: t.isFloat };
        }
        if (t.type === 'ID') {
            consume();
            if (peek().type === 'OP' && peek().value === '(') {
                consume();
                const args = [];
                if (!(peek().type === 'OP' && peek().value === ')')) {
                    args.push(parseExpr());
                    while (peek().type === 'OP' && peek().value === ',') {
                        consume();
                        args.push(parseExpr());
                    }
                }
                expect('OP', ')');
                return { type: 'Call', name: t.value, args };
            }
            return { type: 'Var', name: t.value };
        }
        if (t.type === 'OP' && t.value === '(') {
            consume();
            const expr = parseExpr();
            expect('OP', ')');
            return expr;
        }
        throw new Error(`예상치 못한 토큰: ${t.value || t.type}`);
    }

    function parseUnary() {
        if (peek().type === 'OP' && (peek().value === '-' || peek().value === '+')) {
            const op = consume().value;
            return { type: 'Unary', op, expr: parseUnary() };
        }
        return parsePrimary();
    }

    function parseMul() {
        let left = parseUnary();
        while (peek().type === 'OP' &&
               (peek().value === '*' || peek().value === '/' || peek().value === '//')) {
            const op = consume().value;
            const right = parseUnary();
            left = { type: 'Bin', op, left, right };
        }
        return left;
    }

    function parseAdd() {
        let left = parseMul();
        while (peek().type === 'OP' && (peek().value === '+' || peek().value === '-')) {
            const op = consume().value;
            const right = parseMul();
            left = { type: 'Bin', op, left, right };
        }
        return left;
    }

    function parseExpr() { return parseAdd(); }

    function parseStatement() {
        // ID '=' ... 패턴이면 대입문
        if (peek().type === 'ID' && peek(1).type === 'OP' && peek(1).value === '=') {
            const name = consume().value;
            consume(); // '='
            return { type: 'Assign', name, expr: parseExpr() };
        }
        return { type: 'ExprStmt', expr: parseExpr() };
    }

    function parseProgram() {
        const statements = [];
        while (peek().type === 'NL') consume();
        while (peek().type !== 'EOF') {
            statements.push(parseStatement());
            while (peek().type === 'NL') consume();
        }
        return { type: 'Program', statements };
    }

    return parseProgram();
}

// ---- Evaluator ----
const isBig = (v) => typeof v === 'bigint';

function add(a, b) {
    if (isBig(a) && isBig(b)) return a + b;
    return Number(a) + Number(b);
}
function sub(a, b) {
    if (isBig(a) && isBig(b)) return a - b;
    return Number(a) - Number(b);
}
function mul(a, b) {
    if (isBig(a) && isBig(b)) return a * b;
    return Number(a) * Number(b);
}
function div(a, b) {
    if (isBig(a) && isBig(b)) {
        if (b === 0n) throw new Error('0으로 나눌 수 없습니다');
        if (a % b === 0n) return a / b;
        return Number(a) / Number(b);
    }
    const bn = Number(b);
    if (bn === 0) throw new Error('0으로 나눌 수 없습니다');
    return Number(a) / bn;
}
function floorDiv(a, b) {
    if (isBig(a) && isBig(b)) {
        if (b === 0n) throw new Error('0으로 나눌 수 없습니다');
        return a / b;
    }
    const bn = Number(b);
    if (bn === 0) throw new Error('0으로 나눌 수 없습니다');
    return Math.trunc(Number(a) / bn);
}
function neg(a) { return isBig(a) ? -a : -Number(a); }

function factorial(n) {
    const big = isBig(n) ? n : (Number.isInteger(n) ? BigInt(n) : null);
    if (big === null) throw new Error('factorial 인자는 정수여야 합니다');
    if (big < 0n) throw new Error('factorial은 음수에 대해 정의되지 않습니다');
    if (big > BigInt(FACTORIAL_LIMIT)) {
        throw new Error(`factorial은 ${FACTORIAL_LIMIT}까지만 지원합니다`);
    }
    let r = 1n;
    for (let i = 2n; i <= big; i++) r *= i;
    return r;
}

const FUNCTIONS = {
    sin: (n) => Math.sin(Number(n)),
    cos: (n) => Math.cos(Number(n)),
    tan: (n) => Math.tan(Number(n)),
    factorial,
};

function evalNode(node, env) {
    switch (node.type) {
        case 'Num':
            return node.isFloat ? Number(node.value) : BigInt(node.value);
        case 'Var':
            if (!(node.name in env)) throw new Error(`정의되지 않은 변수: ${node.name}`);
            return env[node.name];
        case 'Call': {
            const fn = FUNCTIONS[node.name];
            if (!fn) throw new Error(`알 수 없는 함수: ${node.name}`);
            if (node.args.length !== 1) throw new Error(`${node.name}은 인자 1개를 받습니다`);
            return fn(evalNode(node.args[0], env));
        }
        case 'Unary': {
            const v = evalNode(node.expr, env);
            return node.op === '-' ? neg(v) : v;
        }
        case 'Bin': {
            const l = evalNode(node.left, env);
            const r = evalNode(node.right, env);
            switch (node.op) {
                case '+':  return add(l, r);
                case '-':  return sub(l, r);
                case '*':  return mul(l, r);
                case '/':  return div(l, r);
                case '//': return floorDiv(l, r);
            }
            throw new Error(`알 수 없는 연산자: ${node.op}`);
        }
        case 'Assign': {
            const v = evalNode(node.expr, env);
            env[node.name] = v;
            return v;
        }
        case 'ExprStmt':
            return evalNode(node.expr, env);
    }
    throw new Error(`알 수 없는 노드: ${node.type}`);
}

function formatValue(v) {
    if (typeof v === 'bigint') return v.toString();
    if (Number.isInteger(v)) return v.toString();
    return Number(v).toString();
}

// 변수 환경을 영속 저장(IndexedDB 등 텍스트 스토리지)에 보관할 수 있도록
// JSON 문자열로 직렬화. BigInt는 _big 마커로 보존해 복원 시 정확.
function serializeEnv(env) {
    const out = {};
    for (const [k, v] of Object.entries(env)) {
        if (typeof v === 'bigint') out[k] = { _big: v.toString() };
        else if (typeof v === 'number' && Number.isFinite(v)) out[k] = { _num: v };
        // 이외 타입(undefined/NaN/Infinity/객체)은 저장 대상 아님 → 스킵
    }
    return JSON.stringify(out);
}

function deserializeEnv(str) {
    const out = {};
    if (!str) return out;
    let parsed;
    try { parsed = JSON.parse(str); } catch { return out; }
    if (!parsed || typeof parsed !== 'object') return out;
    for (const [k, v] of Object.entries(parsed)) {
        if (!v || typeof v !== 'object') continue;
        if (typeof v._big === 'string') {
            try { out[k] = BigInt(v._big); } catch { /* skip */ }
        } else if (typeof v._num === 'number') {
            out[k] = v._num;
        }
    }
    return out;
}

function runCode(source, initialEnv = {}) {
    const tokens = tokenize(source);
    const ast = parse(tokens);
    const env = { ...initialEnv };
    const outputs = [];
    let last;
    for (const stmt of ast.statements) {
        const v = evalNode(stmt, env);
        last = v;
        if (stmt.type === 'Assign') {
            outputs.push(`${stmt.name} = ${formatValue(v)}`);
        } else {
            outputs.push(formatValue(v));
        }
    }
    return { result: last, env, outputs };
}

// ========================================
// IndexedDB Data Source
// ========================================
class IndexedDbSource {
    constructor(options) {
        this.options = options;
        this.db = null;
    }

    async init() {
        this.db = await this.openDb();
    }

    async getNoteByDate(key) {
        const db = await this.ensureDb();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(this.options.storeName, 'readonly');
            const store = tx.objectStore(this.options.storeName);
            const req = store.get(key);

            req.onsuccess = () => {
                const record = req.result;
                resolve({
                    key,
                    content: record?.content ?? '',
                    updatedAt: record?.updatedAt ?? null,
                });
            };
            req.onerror = () => reject(req.error);
        });
    }

    async saveOrUpdateNoteByDate(key, content) {
        const db = await this.ensureDb();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(this.options.storeName, 'readwrite');
            const store = tx.objectStore(this.options.storeName);
            const record = {
                key,
                content,
                updatedAt: new Date().toISOString(),
            };
            const req = store.put(record);

            req.onsuccess = () => resolve(record);
            req.onerror = () => reject(req.error);
        });
    }

    // prefix와 일치하는 키를 가진 레코드 목록을 반환. prefix가 없으면 전체.
    async listKeys(prefix = '') {
        const db = await this.ensureDb();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(this.options.storeName, 'readonly');
            const store = tx.objectStore(this.options.storeName);
            const req = store.openCursor();
            const out = [];
            req.onsuccess = (e) => {
                const cursor = e.target.result;
                if (!cursor) { resolve(out); return; }
                if (!prefix || cursor.key.startsWith(prefix)) {
                    const v = cursor.value;
                    out.push({
                        key: cursor.key,
                        content: v?.content ?? '',
                        updatedAt: v?.updatedAt ?? null,
                    });
                }
                cursor.continue();
            };
            req.onerror = () => reject(req.error);
        });
    }

    async deleteKey(key) {
        const db = await this.ensureDb();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(this.options.storeName, 'readwrite');
            const store = tx.objectStore(this.options.storeName);
            const req = store.delete(key);
            req.onsuccess = () => resolve(true);
            req.onerror = () => reject(req.error);
        });
    }

    async ensureDb() {
        if (!this.db) {
            this.db = await this.openDb();
        }
        return this.db;
    }

    openDb() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(this.options.dbName, this.options.version);

            request.onupgradeneeded = () => {
                const db = request.result;
                if (!db.objectStoreNames.contains(this.options.storeName)) {
                    db.createObjectStore(this.options.storeName, { keyPath: 'key' });
                }
            };

            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    }
}

// REST Data Source (placeholder for server DB)

class RestSource {
    constructor(options) {
        this.options = options;
    }

    async init() {
        return;
    }

    async _fetchWithTimeout(url, options) {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), this.options.timeoutMs);

        try {
            const response = await fetch(url, {
                ...options,
                signal: controller.signal,
            });
            return response;
        } finally {
            clearTimeout(timeout);
        }
    }

    async getNoteByDate(key) {
        const url = `${this.options.baseUrl}/notes/${encodeURIComponent(key)}`;
        const res = await this._fetchWithTimeout(url, { method: 'GET' });
        if (!res.ok) {
            throw new Error(`REST get failed: ${res.status}`);
        }
        return res.json();
    }

    async saveOrUpdateNoteByDate(key, content) {
        const url = `${this.options.baseUrl}/notes/${encodeURIComponent(key)}`;
        const res = await this._fetchWithTimeout(url, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content }),
        });
        if (!res.ok) {
            throw new Error(`REST save failed: ${res.status}`);
        }
        return res.json();
    }

    async listKeys(prefix = '') {
        const url = `${this.options.baseUrl}/notes?prefix=${encodeURIComponent(prefix)}`;
        const res = await this._fetchWithTimeout(url, { method: 'GET' });
        if (!res.ok) throw new Error(`REST list failed: ${res.status}`);
        return res.json();
    }

    async deleteKey(key) {
        const url = `${this.options.baseUrl}/notes/${encodeURIComponent(key)}`;
        const res = await this._fetchWithTimeout(url, { method: 'DELETE' });
        if (!res.ok) throw new Error(`REST delete failed: ${res.status}`);
        return true;
    }
}

// In-memory 데이터 소스 (IndexedDB 폴백용)
// ========================================
class MemorySource {
    constructor() {
        this.store = new Map();
    }

    async init() { /* nothing */ }

    async getNoteByDate(key) {
        const record = this.store.get(key);
        return {
            key,
            content: record?.content ?? '',
            updatedAt: record?.updatedAt ?? null,
        };
    }

    async saveOrUpdateNoteByDate(key, content) {
        const record = {
            key,
            content,
            updatedAt: new Date().toISOString(),
        };
        this.store.set(key, record);
        return record;
    }

    async listKeys(prefix = '') {
        const out = [];
        for (const [key, rec] of this.store.entries()) {
            if (!prefix || key.startsWith(prefix)) {
                out.push({
                    key,
                    content: rec.content,
                    updatedAt: rec.updatedAt,
                });
            }
        }
        return out;
    }

    async deleteKey(key) {
        return this.store.delete(key);
    }
}

function createDataSource(config) {
    if (config.mode === 'rest') {
        return new RestSource(config.rest);
    }
    return new IndexedDbSource(config.indexedDB);
}

let dataSource = createDataSource(STORAGE_CONFIG);
let usingFallback = false;

async function fallbackToMemory(reason) {
    if (usingFallback) return;
    usingFallback = true;
    console.warn('[ssMemo] IndexedDB 실패 → 메모리 저장소로 폴백:', reason);
    dataSource = new MemorySource();
    await dataSource.init();
    AppAPI.showMessage(
        '저장소 경고',
        '브라우저 저장소(IndexedDB)에 접근할 수 없어 임시 메모리 저장으로 동작합니다. 새로고침 시 변경 내용이 유지되지 않을 수 있습니다.'
    );
}

const AppAPI = {
    async init() {
        try {
            if (dataSource?.init) await dataSource.init();
        } catch (err) {
            await fallbackToMemory(err);
        }
    },

    async getNoteByDate(key) {
        try {
            return await dataSource.getNoteByDate(key);
        } catch (err) {
            await fallbackToMemory(err);
            return dataSource.getNoteByDate(key);
        }
    },

    async saveOrUpdateNoteByDate(key, content) {
        try {
            return await dataSource.saveOrUpdateNoteByDate(key, content);
        } catch (err) {
            await fallbackToMemory(err);
            return dataSource.saveOrUpdateNoteByDate(key, content);
        }
    },

    async listKeys(prefix = '') {
        try {
            return await dataSource.listKeys(prefix);
        } catch (err) {
            await fallbackToMemory(err);
            return dataSource.listKeys(prefix);
        }
    },

    async deleteKey(key) {
        try {
            return await dataSource.deleteKey(key);
        } catch (err) {
            await fallbackToMemory(err);
            return dataSource.deleteKey(key);
        }
    },

    isUsingFallback() {
        return usingFallback;
    },

    async showMessage(title, message) {
        return new Promise((resolve) => {
            const modal = document.createElement('div');
            modal.className = 'custom-modal-overlay';
            modal.innerHTML = `
                <div class="custom-modal">
                    <div class="custom-modal-header">${this.escapeHtml(title)}</div>
                    <div class="custom-modal-body">${this.escapeHtml(message)}</div>
                    <div class="custom-modal-footer">
                        <button class="custom-modal-btn">확인</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            const btn = modal.querySelector('.custom-modal-btn');
            const closeModal = () => {
                modal.remove();
                resolve();
            };

            btn.addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });
        });
    },

    async confirm(title, message) {
        return new Promise((resolve) => {
            const modal = document.createElement('div');
            modal.className = 'custom-modal-overlay';
            modal.innerHTML = `
                <div class="custom-modal">
                    <div class="custom-modal-header">${this.escapeHtml(title)}</div>
                    <div class="custom-modal-body">${this.escapeHtml(message)}</div>
                    <div class="custom-modal-footer">
                        <button class="custom-modal-btn custom-modal-btn-cancel">취소</button>
                        <button class="custom-modal-btn custom-modal-btn-danger">확인</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            const cleanup = (result) => {
                modal.remove();
                resolve(result);
            };

            modal.querySelector('.custom-modal-btn-cancel')
                .addEventListener('click', () => cleanup(false));
            modal.querySelector('.custom-modal-btn-danger')
                .addEventListener('click', () => cleanup(true));
            modal.addEventListener('click', (e) => {
                if (e.target === modal) cleanup(false);
            });
        });
    },

    // 옵션 중 하나를 고르는 모달. options: [{value, label, isCurrent?}].
    // 사용자가 선택하면 value를, 취소(취소 버튼/배경 클릭/ESC)하면 null을 반환.
    async choose(title, message, options) {
        return new Promise((resolve) => {
            const modal = document.createElement('div');
            modal.className = 'custom-modal-overlay';
            modal.innerHTML = `
                <div class="custom-modal">
                    <div class="custom-modal-header"></div>
                    <div class="custom-modal-body"></div>
                    <div class="custom-modal-choices"></div>
                    <div class="custom-modal-footer">
                        <button class="custom-modal-btn custom-modal-btn-cancel">취소</button>
                    </div>
                </div>
            `;
            modal.querySelector('.custom-modal-header').textContent = title;
            modal.querySelector('.custom-modal-body').textContent = message;
            document.body.appendChild(modal);

            const cleanup = (val) => { modal.remove(); resolve(val); };

            const choicesEl = modal.querySelector('.custom-modal-choices');
            (options || []).forEach((opt) => {
                const btn = document.createElement('button');
                btn.className = 'custom-modal-btn custom-modal-choice'
                    + (opt.isCurrent ? ' is-current' : '');
                btn.textContent = opt.label;
                btn.addEventListener('click', () => cleanup(opt.value));
                choicesEl.appendChild(btn);
            });

            modal.querySelector('.custom-modal-btn-cancel')
                .addEventListener('click', () => cleanup(null));
            modal.addEventListener('click', (e) => {
                if (e.target === modal) cleanup(null);
            });
        });
    },

    escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    },

    openURL(url) {
        if (window?.go?.main?.App?.OpenURL) {
            return window.go.main.App.OpenURL(url);
        }
        window.open(url, '_blank', 'noopener');
    },

    showLoading(message = '파일을 불러오는 중...') {
        let overlay = document.getElementById('loading-overlay');
        if (!overlay) {
            overlay = document.createElement('div');
            overlay.id = 'loading-overlay';
            overlay.className = 'loading-overlay';
            overlay.innerHTML = `
                <div class="loading-overlay-icon">⏳</div>
                <div class="loading-overlay-message"></div>
            `;
            document.body.appendChild(overlay);
        }
        overlay.querySelector('.loading-overlay-message').textContent = message;
        overlay.style.display = 'flex';
    },

    hideLoading() {
        const overlay = document.getElementById('loading-overlay');
        if (overlay) overlay.remove();
    },
};

// ========================================
// 멀티 메모 저장소
// - IndexedDB(또는 폴백)에 `memo:${title}` 키로 저장.
// - 레거시 NOTEPAD 단일 메모를 첫 실행 시 기본 메모로 마이그레이션.
// - 외부에는 title 기반 API만 노출. 키 형식은 본 모듈 내부에서만 다룬다.
// ========================================


const PREFIX = CONSTANTS.MEMO_KEY_PREFIX;

const toKey = (title) => PREFIX + title;
const fromKey = (key) => key.startsWith(PREFIX) ? key.slice(PREFIX.length) : key;

// 제목 검증 — 빈 문자열/공백만/내부 키와 충돌 가능한 문자 금지.
function validateTitle(title) {
    if (typeof title !== 'string') return '제목이 문자열이 아닙니다.';
    const t = title.trim();
    if (!t) return '제목은 비어 있을 수 없습니다.';
    if (t.length > 100) return '제목은 100자 이내여야 합니다.';
    if (t.includes('\n') || t.includes('\r')) return '제목에 줄바꿈을 포함할 수 없습니다.';
    return null;
}

// 모든 메모 목록 반환. updatedAt 내림차순(최근 수정 먼저).
async function listMemos() {
    const records = await AppAPI.listKeys(PREFIX);
    return records
        .map((r) => ({ title: fromKey(r.key), content: r.content, updatedAt: r.updatedAt }))
        .sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
}

async function loadMemo(title) {
    const rec = await AppAPI.getNoteByDate(toKey(title));
    return { title, content: rec?.content || '', updatedAt: rec?.updatedAt || null };
}

async function saveMemo(title, content) {
    return AppAPI.saveOrUpdateNoteByDate(toKey(title), content);
}

async function deleteMemo(title) {
    return AppAPI.deleteKey(toKey(title));
}

// 제목 변경 — 새 키로 저장 후 옛 키 삭제 (원자성 X, 단일 사용자 로컬 환경에서 허용).
// 새 제목이 이미 존재하면 거부.
async function renameMemo(oldTitle, newTitle) {
    if (oldTitle === newTitle) return;
    const existing = await AppAPI.getNoteByDate(toKey(newTitle));
    if (existing?.updatedAt) {
        throw new Error('같은 제목의 메모가 이미 존재합니다.');
    }
    const cur = await AppAPI.getNoteByDate(toKey(oldTitle));
    await AppAPI.saveOrUpdateNoteByDate(toKey(newTitle), cur?.content || '');
    await AppAPI.deleteKey(toKey(oldTitle));
}

// 레거시 NOTEPAD 단일 메모를 멀티 메모로 마이그레이션.
// 이미 멀티 메모가 하나라도 있으면 스킵 (재실행 안전).
// NOTEPAD에 콘텐츠가 있으면 DEFAULT_MEMO_TITLE로 이전, 비어 있어도 빈 기본 메모 생성.
// 반환값: 마이그레이션 후 사용할 기본 메모 title.
async function ensureAtLeastOneMemo() {
    const memos = await listMemos();
    if (memos.length > 0) return memos[0].title;

    const legacy = await AppAPI.getNoteByDate(CONSTANTS.NOTEPAD_KEY);
    const content = legacy?.content || '';
    const title = CONSTANTS.DEFAULT_MEMO_TITLE;
    await saveMemo(title, content);
    // 레거시 키는 마이그레이션 후 제거 — 다음 부팅에서 빈 회귀 방지.
    try { await AppAPI.deleteKey(CONSTANTS.NOTEPAD_KEY); } catch { /* ignore */ }
    return title;
}

// ========================================
// Note Search UI
// ========================================


const NoteSearchUI = {
    setup() {
        state.elements.noteSearchInput = document.getElementById('noteSearchInput');
        state.elements.noteSearchBtn = document.getElementById('noteSearchBtn');
        state.elements.noteSearchPrevBtn = document.getElementById('noteSearchPrevBtn');
        state.elements.noteSearchNextBtn = document.getElementById('noteSearchNextBtn');

        if (!state.elements.noteSearchInput || !state.elements.noteSearchBtn ||
            !state.elements.noteSearchPrevBtn || !state.elements.noteSearchNextBtn) return;

        state.elements.noteSearchBtn.addEventListener('click', () => {
            this.find({ startFromBeginning: true });
        });

        state.elements.noteSearchPrevBtn.addEventListener('click', () => {
            this.findPrev();
        });

        state.elements.noteSearchNextBtn.addEventListener('click', () => {
            this.find({ startFromBeginning: false });
        });

        state.elements.noteSearchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                this.find({ startFromBeginning: true });
            }
        });
    },

    find({ startFromBeginning }) {
        const noteEditor = this.getCurrentEditor();
        if (!noteEditor || !state.elements.noteSearchInput) return;

        const query = state.elements.noteSearchInput.value;
        if (!query) return;

        const content = noteEditor.value;
        const startIndex = startFromBeginning ? 0 : noteEditor.selectionEnd;
        let matchIndex = content.indexOf(query, startIndex);

        if (matchIndex === -1 && startIndex > 0) {
            matchIndex = content.indexOf(query, 0);
        }

        if (matchIndex === -1) {
            this.showMiss();
            return;
        }

        state.elements.noteSearchInput.classList.remove('note-search-miss');
        noteEditor.focus();
        noteEditor.setSelectionRange(matchIndex, matchIndex + query.length);
        this.scrollToIndex(noteEditor, matchIndex);
    },

    findPrev() {
        const noteEditor = this.getCurrentEditor();
        if (!noteEditor || !state.elements.noteSearchInput) return;

        const query = state.elements.noteSearchInput.value;
        if (!query) return;

        const content = noteEditor.value;
        const startIndex = noteEditor.selectionStart - 1;

        if (startIndex < 0) return;

        let matchIndex = content.lastIndexOf(query, startIndex);

        if (matchIndex === -1) {
            matchIndex = content.lastIndexOf(query, content.length);
        }

        if (matchIndex === -1) {
            this.showMiss();
            return;
        }

        state.elements.noteSearchInput.classList.remove('note-search-miss');
        noteEditor.focus();
        noteEditor.setSelectionRange(matchIndex, matchIndex + query.length);
        this.scrollToIndex(noteEditor, matchIndex);
    },

    getCurrentEditor() {
        // 현재 활성화된 에디터를 찾습니다
        const activeContainer = document.querySelector('.note-editor-container:not(.hidden)');
        if (!activeContainer) return null;

        const editor = activeContainer.querySelector('.note-editor');
        return editor;
    },

    showMiss() {
        state.elements.noteSearchInput.classList.add('note-search-miss');
        setTimeout(() => {
            state.elements.noteSearchInput.classList.remove('note-search-miss');
        }, CONSTANTS.SEARCH_MISS_DURATION);
    },

    scrollToIndex(noteEditor, index) {
        const textBefore = noteEditor.value.slice(0, index);
        const lineIndex = textBefore.split('\n').length - 1;
        const style = window.getComputedStyle(noteEditor);
        const lineHeight = parseFloat(style.lineHeight) || 24;
        const paddingTop = parseFloat(style.paddingTop) || 0;
        const targetTop = (lineIndex * lineHeight) + paddingTop;
        const offset = noteEditor.clientHeight / 3;
        noteEditor.scrollTop = Math.max(0, targetTop - offset);
    }
};

// ========================================
// Notepad Management
// ========================================










// Cache DOM elements
let notePanel = null;
let noteEditor = null;
let lineNumbers = null;
let charCountEl = null;

// 빈 문자열도 textarea에서 1줄로 보이므로 최소 1로 보정.
// split보다 빠르게 줄 수만 세는 헬퍼 — 5MB 파일에서 split 배열 할당 비용을 피한다.
function countLines(text) {
    if (!text) return 1;
    let count = 1;
    for (let i = 0; i < text.length; i++) {
        if (text.charCodeAt(i) === 10) count++;
    }
    return count;
}

// 줄 번호 영역 갱신 + 줄 수 캐시. 줄 수가 그대로면 textContent를
// 다시 쓰지 않아 큰 파일 입력 중 리플로우/리페인트 비용을 절감한다.
function refreshLineNumbers(editor, lineNumbersEl) {
    if (!editor || !lineNumbersEl) return;
    const count = countLines(editor.value);
    if (lineNumbersEl.__ssLineCount !== count) {
        lineNumbersEl.textContent = buildLineNumbersText(count);
        lineNumbersEl.__ssLineCount = count;
    }
    lineNumbersEl.scrollTop = editor.scrollTop;
}

// 파일 탭 관리 상태
const fileTabs = {
    slots: Array(7).fill(null), // 각 슬롯의 파일 정보 {fileName, content}
    currentTab: 'main', // 현재 활성 탭
    wrapStates: { main: false, 0: false, 1: false, 2: false, 3: false, 4: false, 5: false, 6: false }, // 각 탭의 줄바꿈 상태
    previewStates: { 0: false, 1: false, 2: false, 3: false, 4: false, 5: false, 6: false } // .md 미리보기 상태
};

// 코드 블럭 실행기의 메모리 — "메모리에 저장" 옵션을 선택했을 때만 갱신됨.
// IndexedDB(또는 폴백 메모리)에 영속 저장되며, Notepad.open()에서 자동 로드.
const calcMemory = {};

// 메모리를 영속 저장에 기록. IndexedDB 실패 시 AppAPI가 메모리 폴백으로 처리.
async function persistCalcMemory() {
    try {
        await AppAPI.saveOrUpdateNoteByDate(CONSTANTS.CALC_MEMORY_KEY, serializeEnv(calcMemory));
    } catch (e) {
        console.warn('[ssMemo] 코드 메모리 저장 실패:', e);
    }
}

// 영속 저장에서 메모리를 읽어 calcMemory에 채움. 손상 시 빈 상태로 동작.
async function loadCalcMemory() {
    try {
        const rec = await AppAPI.getNoteByDate(CONSTANTS.CALC_MEMORY_KEY);
        const restored = deserializeEnv(rec?.content || '');
        for (const k of Object.keys(calcMemory)) delete calcMemory[k];
        Object.assign(calcMemory, restored);
    } catch (e) {
        console.warn('[ssMemo] 코드 메모리 로드 실패:', e);
    }
}

const Notepad = {
    async open() {
        notePanel = document.getElementById('note-panel');
        noteEditor = document.getElementById('note-editor');
        lineNumbers = document.getElementById('line-numbers');
        charCountEl = document.getElementById('note-char-count');

        if (!notePanel || !noteEditor || !lineNumbers || !charCountEl) return;

        notePanel.classList.remove('hidden');
        noteEditor.focus();

        try {
            // 레거시 NOTEPAD → memo:기본 메모 마이그레이션 (이미 메모가 있으면 스킵).
            const firstTitle = await ensureAtLeastOneMemo();
            const memo = await loadMemo(firstTitle);
            noteEditor.value = memo.content || '';
            state.notepad.currentMemoTitle = firstTitle;
        } catch (e) {
            console.error('Failed to load notepad content:', e);
            noteEditor.value = '';
            state.notepad.currentMemoTitle = CONSTANTS.DEFAULT_MEMO_TITLE;
        }

        state.notepad.lastSavedContent = noteEditor.value;
        state.notepad.isDirty = false;
        this.refreshTitleDisplay();

        // 저장된 코드 블럭 메모리를 읽어 calcMemory에 채운다.
        // 이후 runCodeBlock에서 즉시 사용 가능하도록 await로 동기화.
        await loadCalcMemory();

        this.updateLineNumbers();
        this.updateCharCount();
        // 로드된 메모에 이미 절취선이 있을 수 있으므로 버튼 상태 동기화.
        this.syncSplitButtonState();

        // 큰 파일에서 keystroke마다 전체 스캔(countLines)을 돌면 입력이 끊긴다.
        // 줄번호 갱신은 50ms로 묶고, char count/scroll/isDirty는 즉시 반영.
        const debouncedLineNumbers = debounce(() => this.updateLineNumbers(), 50);

        noteEditor.oninput = () => {
            debouncedLineNumbers();
            this.updateCharCount();
            lineNumbers.scrollTop = noteEditor.scrollTop;
            state.notepad.isDirty = noteEditor.value !== state.notepad.lastSavedContent;
        };

        noteEditor.onscroll = () => {
            lineNumbers.scrollTop = noteEditor.scrollTop;
        };

        noteEditor.onkeydown = (e) => this.handleKeyDown(e);
        noteEditor.oncontextmenu = (e) => this.handleContextMenu(e);

        // 탭 클릭 핸들러 설정
        this.setupTabClickHandlers();

        // Drag & Drop 핸들러 설정
        this.setupDragAndDrop();

        this.startAutoSave();
    },

    async close() {
        if (notePanel && !notePanel.classList.contains('hidden')) {
            await this.saveAll();
            notePanel.classList.add('hidden');
            this.stopAutoSave();
        }
    },

    async save() {
        if (!noteEditor) return "저장할 데이터가 없습니다.";

        const content = noteEditor.value;
        if (!state.notepad.isDirty || content === state.notepad.lastSavedContent) {
            return "변경된 내용이 없습니다.";
        }

        const title = state.notepad.currentMemoTitle;
        if (!title) return "현재 메모를 알 수 없어 저장하지 못했습니다.";

        let retMsg = "저장에 성공했습니다.";
        try {
            await saveMemo(title, content);
            state.notepad.lastSavedContent = content;
            state.notepad.isDirty = false;
            console.log(`Notepad auto-saved: ${title}`);
        } catch (e) {
            console.error('Failed to save notepad:', e);
            retMsg = "저장에 실패했습니다.";
        }
        return retMsg;
    },

    async saveWithNotification() {
        const msg = await this.save();
        await AppAPI.showMessage('메모 저장', msg);
    },

    startAutoSave() {
        if (state.notepad.autoSaveTimer) clearInterval(state.notepad.autoSaveTimer);
        state.notepad.autoSaveTimer = setInterval(() => this.saveAll(), CONSTANTS.AUTO_SAVE_INTERVAL);
    },

    stopAutoSave() {
        if (state.notepad.autoSaveTimer) {
            clearInterval(state.notepad.autoSaveTimer);
            state.notepad.autoSaveTimer = null;
        }
    },

    // 현재 활성 탭의 에디터/줄번호/메모 슬롯 컨텍스트. 메인 탭이면 slot=null.
    activeEditorContext() {
        const tabId = fileTabs.currentTab;
        if (tabId === 'main') {
            return { tabId, editor: noteEditor, lineNumbersEl: lineNumbers, slot: null };
        }
        return {
            tabId,
            editor: document.getElementById(`note-editor-${tabId}`),
            lineNumbersEl: document.getElementById(`line-numbers-${tabId}`),
            slot: fileTabs.slots[tabId] || null,
        };
    },

    // 프로그램적 편집(구분선/기호 삽입 등) 후 줄번호/글자수/미저장 상태를 활성 탭 기준으로 갱신.
    afterProgrammaticEdit(ctx) {
        refreshLineNumbers(ctx.editor, ctx.lineNumbersEl);
        if (charCountEl) charCountEl.textContent = `글자수: ${ctx.editor.value.length}`;
        if (ctx.tabId === 'main') {
            state.notepad.isDirty = ctx.editor.value !== state.notepad.lastSavedContent;
        } else if (ctx.slot && ctx.slot.kind === 'memo') {
            ctx.slot.content = ctx.editor.value;
            ctx.slot.isDirty = ctx.editor.value !== ctx.slot.lastSavedContent;
            this.setMemoTabDirty(ctx.tabId, ctx.slot.isDirty);
        }
    },

    insertDivider() {
        const ctx = this.activeEditorContext();
        const editor = ctx.editor;
        if (!editor || editor.readOnly) return;

        const divider = '─'.repeat(CONSTANTS.DIVIDER_LENGTH);
        const cursorPos = editor.selectionStart;
        const textBefore = editor.value.substring(0, cursorPos);
        const textAfter = editor.value.substring(editor.selectionEnd);

        const prefix = (textBefore.length > 0 && !textBefore.endsWith('\n')) ? '\n' : '';
        const suffix = (textAfter.length > 0 && !textAfter.startsWith('\n')) ? '\n' : '';

        const newText = textBefore + prefix + divider + suffix + textAfter;
        editor.value = newText;

        const newCursorPos = cursorPos + prefix.length + divider.length + suffix.length;
        editor.setSelectionRange(newCursorPos, newCursorPos);

        this.afterProgrammaticEdit(ctx);
    },

    insertSymbol(symbol) {
        const ctx = this.activeEditorContext();
        const editor = ctx.editor;
        if (!editor || editor.readOnly) return;

        const cursorPos = editor.selectionStart;
        const textBefore = editor.value.substring(0, cursorPos);
        const textAfter = editor.value.substring(editor.selectionEnd);

        const newText = textBefore + symbol + textAfter;
        editor.value = newText;

        const newCursorPos = cursorPos + symbol.length;
        editor.setSelectionRange(newCursorPos, newCursorPos);

        this.afterProgrammaticEdit(ctx);
    },

    updateCharCount() {
        if (!noteEditor || !charCountEl) return;
        charCountEl.textContent = `글자수: ${noteEditor.value.length}`;
    },

    updateLineNumbers() {
        refreshLineNumbers(noteEditor, lineNumbers);
    },

    handleContextMenu(e) {
        if (!noteEditor) return;

        const start = noteEditor.selectionStart;
        const end = noteEditor.selectionEnd;

        if (start === end) return;

        const selectedText = noteEditor.value.substring(start, end).trim();
        const urlPattern = /^(https?:\/\/|www\.)/i;
        if (urlPattern.test(selectedText)) {
            e.preventDefault();

            let url = selectedText;
            if (url.startsWith('www.')) {
                url = 'https://' + url;
            }

            AppAPI.openURL(url);
        }
    },

    handleKeyDown(e) {
        if (e.ctrlKey && (e.key === 'F' || e.key === 'I' || e.key === 'i')) {
            e.preventDefault();
            state.elements.noteSearchInput?.focus();
            return;
        }

        if (e.key === 'PageUp' || (e.altKey && (e.key === 'B' || e.key === 'b'))) {
            e.preventDefault();
            const currentEditor = fileTabs.currentTab === 'main'
                ? noteEditor
                : document.getElementById(`note-editor-${fileTabs.currentTab}`);
            if (currentEditor) currentEditor.scrollTop -= currentEditor.clientHeight;
            return;
        }

        if (e.key === 'PageDown' || (e.altKey && (e.key === 'F' || e.key === 'f'))) {
            e.preventDefault();
            const currentEditor = fileTabs.currentTab === 'main'
                ? noteEditor
                : document.getElementById(`note-editor-${fileTabs.currentTab}`);
            if (currentEditor) currentEditor.scrollTop += currentEditor.clientHeight;
            return;
        }

        if (e.ctrlKey && (e.key === '6' || e.key === 'h' || e.key === 'H')) {
            e.preventDefault();
            if (noteEditor) {
                noteEditor.setSelectionRange(0, 0);
                noteEditor.scrollTop = 0;
            }
            return;
        }

        if (e.ctrlKey && (e.key === '4' || e.key === 'e' || e.key === 'E')) {
            e.preventDefault();
            if (noteEditor) {
                const endPos = noteEditor.value.length;
                noteEditor.setSelectionRange(endPos, endPos);
                noteEditor.scrollTop = noteEditor.scrollHeight;
            }
            return;
        }

        if (e.ctrlKey && (e.key === ',' || e.key === 'b' || e.key === 'B')) {
            e.preventDefault();
            NoteSearchUI.findPrev();
            return;
        }

        if (e.ctrlKey && (e.key === 'n' || e.key === 'N' || e.key === '.')) {
            e.preventDefault();
            NoteSearchUI.find({ startFromBeginning: false });
            return;
        }

        if (e.ctrlKey && (e.key === 'l' || e.key === 'L')) {
            e.preventDefault();
            this.insertDivider();
            return;
        }

        if (e.ctrlKey && e.key === 'Enter') {
            e.preventDefault();
            this.runCodeBlock();
            return;
        }

        if (e.ctrlKey && e.shiftKey && e.key) {
            const upperKey = e.key.toUpperCase();
            const symbol = SYMBOL_SHORTCUTS[upperKey];
            if (symbol) {
                e.preventDefault();
                this.insertSymbol(symbol);
                return;
            }
        }
    },

    // 절취선 토글 버튼의 텍스트/툴팁을 현재 메모 내용에 맞춘다.
    // 메모 로드/리셋/분할 토글 직후 호출해 시각과 콘텐츠 상태를 일치시킨다.
    syncSplitButtonState(len = 2000) {
        const btn = document.querySelector('button[onclick^="splitNoteIntoChunks"]');
        if (!btn || !noteEditor) return;
        const hasDelimiter = noteEditor.value.includes(CHUNK_DELIMITER);
        if (hasDelimiter) {
            btn.textContent = '➕';
            btn.title = '절취선 문구 삭제';
        } else {
            btn.textContent = '➗';
            btn.title = `${len}자 크기로 나누기`;
        }
    },

    splitNoteIntoChunks(len) {
        if (!noteEditor) return;
        const content = noteEditor.value;
        const action = decideChunkAction(content, len);
        if (action === 'noop') return;

        if (action === 'join') {
            noteEditor.value = joinTextChunks(content);
            if (state.elements.noteSearchInput &&
                state.elements.noteSearchInput.value === '절취선') {
                state.elements.noteSearchInput.value = '';
            }
        } else {
            noteEditor.value = splitTextIntoChunks(content, len);
            if (state.elements.noteSearchInput) {
                state.elements.noteSearchInput.value = '절취선';
            }
        }

        this.syncSplitButtonState(len);
        this.updateLineNumbers();
        this.updateCharCount();
        state.notepad.isDirty = noteEditor.value !== state.notepad.lastSavedContent;
    },

    showHelpPanel() {
